# Ambiente QGIS headless riproducibile: stessa versione per tutti gli utenti
# e per la CI. Per aggiornare QGIS: cambia la versione qui sotto, poi ricrea
# l'ambiente (micromamba env remove -n qgis -y && bash setup.sh).
#
# La versione pinnata è l'ultima validata dalla CI su Linux e Windows.
#
# QGIS segue la LTR, che conda-forge pubblica sotto l'etichetta qgis_ltr
# (non sul canale principale): l'etichetta va elencata PRIMA di conda-forge.
name: qgis
channels:
  - conda-forge/label/qgis_ltr
  - conda-forge
dependencies:
  - qgis=3.44.15
